<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbería Juan Ma</title>
<meta name="description" content="Barbería Juan Ma — cortes, barba y afeitado clásico.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:      #0e0e0e;
    --black-2:    #1a1a1a;
    --white:      #f5f4f1;
    --grey:       rgba(245,244,241,0.6);
    --grey-line:  rgba(245,244,241,0.14);
    --accent:     #c9a227;   /* dorado, típico de barbería clásica */
    --font-display: 'Archivo Black', sans-serif;
    --font-body:    'Work Sans', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1280px;margin:0 auto;padding:0 32px;}

  /* ---------- Header ---------- */
  header{
    background:var(--black-2);
    border-bottom:1px solid var(--grey-line);
  }
  nav{
    display:flex;align-items:center;justify-content:space-between;
    max-width:1280px;margin:0 auto;padding:0;
    height:78px;
  }
  .brand{
    font-family:var(--font-display);
    font-size:1.1rem;
    letter-spacing:.02em;
    padding:0 32px;
    height:100%;
    display:flex;align-items:center;
    background:#232323;
  }
  .brand span{display:block;font-size:.65rem;color:var(--grey);margin-top:2px;font-family:var(--font-body);letter-spacing:.14em;}

  .nav-links{
    display:flex;align-items:center;gap:34px;
    font-size:.8rem;font-weight:600;letter-spacing:.06em;
  }
  .nav-links a{padding:8px 0;position:relative;}
  .nav-links a:hover{color:var(--accent);}

  .nav-tools{display:flex;align-items:center;gap:22px;padding-right:32px;}
  .icon-btn{
    width:20px;height:20px;display:flex;align-items:center;justify-content:center;
    opacity:.85;cursor:pointer;
  }
  .menu-box{
    width:52px;height:52px;border:1px solid var(--grey-line);
    display:flex;align-items:center;justify-content:center;
    margin-right:32px;cursor:pointer;
  }
  .menu-box .dots{
    display:grid;grid-template-columns:repeat(2,5px);gap:5px;
  }
  .menu-box .dots span{width:5px;height:5px;background:var(--white);border-radius:50%;}

  .nav-toggle{display:none;background:none;border:none;color:var(--white);font-size:1.5rem;padding:0 20px;cursor:pointer;}

  @media(max-width:900px){
    .nav-links,.nav-tools{display:none;}
    .nav-toggle{display:block;margin-left:auto;}
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    min-height:640px;
    display:flex;align-items:center;
    overflow:hidden;
  }
  .hero-photo{
    position:absolute;
    top:0;right:0;bottom:0;
    width:58%;
    background:linear-gradient(120deg,#000 0%,#1c1c1c 40%,#3a3a3a 100%);
  }
  .hero-photo::after{
    content:"Foto del barbero / local";
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    color:rgba(245,244,241,0.28);font-size:.85rem;letter-spacing:.04em;
  }
  .hero-photo::before{
    content:"";
    position:absolute;left:-1px;top:0;bottom:0;width:220px;
    background:linear-gradient(90deg,var(--black) 0%,rgba(14,14,14,0) 100%);
    z-index:2;
  }

  .hero-content{
    position:relative;z-index:3;
    padding:100px 0 90px;
    max-width:640px;
  }
  .hero-eyebrow{
    font-size:.78rem;font-weight:600;letter-spacing:.14em;
    color:var(--accent);margin-bottom:22px;
  }
  .hero h1{
    font-family:var(--font-display);
    font-size:clamp(2.6rem,6.4vw,4.6rem);
    line-height:.98;
    letter-spacing:-.01em;
  }
  .hero-address{
    margin-top:26px;color:var(--grey);font-size:1rem;max-width:34ch;
  }
  .hero-actions{margin-top:38px;display:flex;align-items:center;gap:18px;}
  .btn-read{
    display:inline-flex;align-items:center;gap:12px;
    background:var(--white);color:var(--black);
    padding:15px 24px;font-size:.88rem;font-weight:600;
  }
  .btn-read .arrow{
    width:30px;height:30px;border:1px solid var(--black);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:.9rem;
  }

  .hero-dots{
    position:absolute;left:32px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:14px;z-index:3;
  }
  .hero-dots span{width:7px;height:7px;border-radius:50%;border:1px solid var(--grey);}
  .hero-dots span.active{background:var(--white);border-color:var(--white);}

  @media(max-width:760px){
    .hero{min-height:auto;}
    .hero-photo{width:100%;opacity:.35;}
    .hero-photo::before{display:none;}
    .hero-content{padding:80px 28px 70px;max-width:100%;}
    .hero-dots{display:none;}
  }
</style>
</head>
<body>

<header>
  <nav>
    <div class="brand">
      JUAN MA
      <span></span>
    </div>
    <div class="nav-links">
      <a href="#inicio">Inicio</a>
      <a href="#servicios">Servicios</a>
      <a href="#galeria">Galería</a>
      <a href="#equipo">Equipo</a>
      <a href="#contacto">Contacto</a>
    </div>
    <div class="nav-tools">
      <div class="icon-btn">🔍</div>
    </div>
    <div class="menu-box">
      <div class="dots"><span></span><span></span><span></span><span></span></div>
    </div>
    <button class="nav-toggle" aria-label="Abrir menú">☰</button>
  </nav>
</header>

<section class="hero" id="inicio">
  <div class="hero-photo"></div>
  <div class="hero-dots">
    <span class="active"></span>
    <span></span>
    <span></span>
  </div>
  <div class="wrap">
    <div class="hero-content">
      <div class="hero-eyebrow">CORTE &amp; AFEITADO CLÁSICO</div>
      <h1>BARBERÍA<br>JUAN MA.</h1>
      <p class="hero-address">Nos encontrarás en Calle Ejemplo 12, Tu Ciudad.</p>
      <div class="hero-actions">
        <a href="#servicios" class="btn-read">
          Ver servicios
          <span class="arrow">↗</span>
        </a>
      </div>
    </div>
  </div>
</section>

</body>
</html>
